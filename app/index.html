<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- minimum-scale=1.0 stops pinch-zoom-OUT below 100% (which would reveal the
         cream body background as "white space" around the content on mobile).
         Zoom-IN is still allowed for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <title>فاست أكسس — تخزين وتجهيز وشحن لمتاجر التجارة الإلكترونية</title>
    <meta name="description" content="شريكك اللوجستي في السعودية: تخزين، تجهيز طلبات بهوية علامتك، شحن وتتبع لحظي، وتوصيل بنفس اليوم من المخازن السحابية. خلّها علينا." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fast Access — فاست أكسس" />
    <meta property="og:title" content="فاست أكسس — تخزين وتجهيز وشحن لمتاجر التجارة الإلكترونية" />
    <meta property="og:description" content="شريكك اللوجستي في السعودية. خلّها علينا." />
    <meta property="og:url" content="https://faccess.co" />
    <meta property="og:image" content="https://faccess.co/assets/hero-bg.webp" />
    <link rel="icon" type="image/png" href="/assets/logo-mark.png" />
    <!-- Self-hosted fonts: preload the two files needed for first paint -->
    <link rel="preload" href="/fonts/zain-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/zain-arabic-800-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" as="image" fetchpriority="high" imagesrcset="/assets/hero-bg-768.webp 768w, /assets/hero-bg.webp 1344w" imagesizes="100vw">
    <!-- Critical CSS: paint the hero shell before the bundle arrives -->
    <style>
      /* Critical shell: paints the hero before the async stylesheet arrives */
      *,*::before,*::after{box-sizing:border-box}
      html{background:#F4F4F1;-webkit-text-size-adjust:100%}
      body{margin:0;background:#F4F4F1;color:#0D1232;font-family:'Zain','Geist',system-ui,sans-serif}
      #root{min-height:100svh}
      #root:empty{background:#0D1232}
      #hero{position:relative;display:flex;align-items:center;min-height:92svh;background:#0D1232;overflow:hidden}
      #hero .hero-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62}
    </style>
  </head>
  <body>
    <!-- Mark the document animation-ready at first paint so reveal-on-scroll
         items start hidden and animate in. If this script never runs (JS off
         or failed), content stays visible — no blank sections. -->
    <script>document.documentElement.classList.add('anim-ready');</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
